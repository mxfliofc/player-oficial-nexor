<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NEXOR Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.player{
    position:relative;
    width:min(100vw,177.777vh);
    aspect-ratio:16/9;
    max-width:100%;
    max-height:100%;
    background:#000;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
}

/* =========================================================
   VIDEO
========================================================= */

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    display:block;
}

/* =========================================================
   BANNER
========================================================= */

.banner{
    position:absolute;
    inset:0;
    z-index:8;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    opacity:1;
    visibility:visible;

    transition:
        opacity .25s ease,
        visibility .25s ease;

    pointer-events:none;
}

.banner.hidden{
    opacity:0;
    visibility:hidden;
}

.banner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =========================================================
   ESCURECIMENTO
========================================================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:5;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.60),
            transparent 25%,
            transparent 65%,
            rgba(0,0,0,.75)
        );

    opacity:1;
    transition:opacity .25s ease;
}

.player.controls-hidden .overlay{
    opacity:0;
}

/* =========================================================
   TOPO
========================================================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;

    z-index:15;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 15px;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.player.controls-hidden .topbar{
    opacity:0;
    transform:translateY(-10px);
    pointer-events:none;
}

.live-info{
    display:flex;
    align-items:center;
    gap:8px;
}

.live-dot{
    width:9px;
    height:9px;
    background:#ff1744;
    border-radius:50%;
    box-shadow:0 0 10px rgba(255,23,68,.8);
}

.live-text{
    color:#fff;
    font-size:12px;
    font-weight:bold;
    letter-spacing:.5px;
}

.viewers{
    color:#ddd;
    font-size:12px;
    margin-left:8px;
}

/* =========================================================
   BOTÕES
========================================================= */

button{
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.icon-btn{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:18px;

    transition:
        background .15s ease,
        transform .15s ease;
}

.icon-btn:hover{
    background:rgba(255,255,255,.12);
}

.icon-btn:active{
    transform:scale(.92);
}

/* =========================================================
   CENTRO
========================================================= */

.center-controls{
    position:absolute;
    inset:0;

    z-index:12;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:28px;

    pointer-events:none;

    transition:opacity .25s ease;
}

.center-controls button{
    pointer-events:auto;
}

.player.controls-hidden .center-controls{
    opacity:0;
    pointer-events:none;
}

.center-btn{
    width:48px;
    height:48px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.45);

    font-size:21px;

    transition:
        transform .15s ease,
        background .15s ease;
}

.center-btn:hover{
    background:rgba(0,0,0,.65);
}

.center-btn:active{
    transform:scale(.90);
}

.center-play{
    width:64px;
    height:64px;

    background:rgba(220,0,35,.90);

    font-size:26px;
}

.center-play:hover{
    background:#e6002d;
}

/* =========================================================
   PLAY SYMBOL
========================================================= */

.play-symbol{
    width:0;
    height:0;

    border-top:9px solid transparent;
    border-bottom:9px solid transparent;
    border-left:14px solid #fff;

    margin-left:4px;
}

.is-playing .play-symbol{
    width:14px;
    height:18px;

    border:0;
    margin-left:0;

    position:relative;
}

.is-playing .play-symbol::before,
.is-playing .play-symbol::after{
    content:"";

    position:absolute;
    top:0;

    width:5px;
    height:18px;

    background:#fff;
    border-radius:1px;
}

.is-playing .play-symbol::before{
    left:0;
}

.is-playing .play-symbol::after{
    right:0;
}

/* =========================================================
   BOTTOM BAR
========================================================= */

.bottombar{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:15;

    padding:10px 13px 12px;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.player.controls-hidden .bottombar{
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-container{
    width:100%;
    height:5px;

    background:rgba(255,255,255,.25);

    border-radius:5px;

    cursor:pointer;

    margin-bottom:9px;

    position:relative;
}

.progress{
    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:0%;

    background:#e6002d;

    border-radius:5px;

    pointer-events:none;
}

.progress-thumb{
    position:absolute;

    top:50%;
    left:0%;

    width:12px;
    height:12px;

    background:#fff;

    border-radius:50%;

    transform:translate(-50%,-50%);

    opacity:0;

    transition:opacity .15s;
}

.progress-container:hover .progress-thumb{
    opacity:1;
}

/* =========================================================
   CONTROLES INFERIORES
========================================================= */

.controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.small-btn{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:18px;
}

.small-btn:hover{
    background:rgba(255,255,255,.12);
}

.time{
    color:#fff;
    font-size:12px;

    margin-left:3px;

    white-space:nowrap;
}

.spacer{
    flex:1;
}

/* =========================================================
   VOLUME
========================================================= */

.volume-box{
    display:flex;
    align-items:center;
}

.volume-range{
    width:75px;
    height:4px;

    accent-color:#e6002d;

    cursor:pointer;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings{
    position:absolute;

    right:12px;
    bottom:62px;

    z-index:30;

    width:180px;

    background:rgba(15,15,15,.96);

    border:1px solid rgba(255,255,255,.1);

    border-radius:10px;

    padding:7px;

    box-shadow:0 10px 30px rgba(0,0,0,.5);

    display:none;
}

.settings.show{
    display:block;
}

.settings-title{
    color:#aaa;
    font-size:11px;

    padding:7px 9px;
}

.speed-option{
    width:100%;

    padding:9px;

    color:#fff;

    text-align:left;

    border-radius:6px;

    font-size:13px;
}

.speed-option:hover{
    background:rgba(255,255,255,.1);
}

.speed-option.active{
    color:#ff1744;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.40);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .2s ease,
        visibility .2s ease;

    pointer-events:none;
}

.loading.show{
    opacity:1;
    visibility:visible;
}

.spinner{
    width:38px;
    height:38px;

    border:3px solid rgba(255,255,255,.25);

    border-top-color:#e6002d;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin-bottom:10px;
}

.loading-text{
    color:#fff;
    font-size:13px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   ERRO
========================================================= */

.error-box{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:40;

    width:min(90%,380px);

    padding:18px;

    border-radius:10px;

    background:rgba(15,15,15,.96);

    border:1px solid rgba(255,255,255,.1);

    text-align:center;

    display:none;
}

.error-box.show{
    display:block;
}

.error-title{
    color:#fff;
    font-weight:bold;
    margin-bottom:6px;
}

.error-text{
    color:#bbb;
    font-size:12px;
    line-height:1.5;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .topbar{
        padding:8px 9px;
    }

    .center-controls{
        gap:15px;
    }

    .center-btn{
        width:42px;
        height:42px;
    }

    .center-play{
        width:56px;
        height:56px;
    }

    .volume-range{
        display:none;
    }

    .bottombar{
        padding:7px 8px 9px;
    }

    .small-btn{
        width:34px;
        height:34px;
    }

    .time{
        font-size:11px;
    }
}

/* =========================================================
   FULLSCREEN
========================================================= */

.player:fullscreen{
    width:100vw;
    height:100vh;
    max-width:none;
    max-height:none;
    aspect-ratio:auto;
}

.player:-webkit-full-screen{
    width:100vw;
    height:100vh;
    max-width:none;
    max-height:none;
}

video::-webkit-media-controls{
    display:none !important;
}
</style>
</head>

<body>

<div class="player" id="player">

    <!-- VIDEO -->
    <video
        id="video"

    </video>

    <!-- BANNER -->

    <!-- ESCURECIMENTO -->

        </button>

            class="speed-option"

        </button>

    <!-- BOTTOM -->
    <div class="bottombar">

                class="progress"

                ⚙

                id="fullscreenBtn"

                ⛶
            </button>

</div>


<script>
/* =========================================================
   CONFIGURAÇÃO
========================================================= */

/*
   Formatos aceitos:
   - /player/https%3A%2F%2Fservidor.exemplo%2Fvideo.m3u8
   - /player/aHR0cHM6Ly9zZXJ2aWRvci5leGVtcGxvL3ZpZGVvLm0zdTg (Base64 URL-safe)
   - /?url=https%3A%2F%2Fservidor.exemplo%2Fvideo.m3u8 (compatibilidade)
*/
function getMediaUrl(){

    const queryUrl =
        new URLSearchParams(window.location.search).get("url");

    if(queryUrl){
        return queryUrl;
    }

    const prefix = "/player/";
    const path = window.location.pathname;

    if(!path.startsWith(prefix)){
        return "";
    }

    const value = path.slice(prefix.length);

    if(!value){
        return "";
    }

    try{
        const decoded = decodeURIComponent(value);

        if(/^https?:\/\//i.test(decoded)){
            return decoded;
        }
    }catch(error){
        console.warn("URL de mídia inválida:", error);
    }

    /* Permite uma URL em Base64 URL-safe, útil para links com tokens e ? */
    try{
        const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
        const decoded = decodeURIComponent(escape(atob(padded)));

        return /^https?:\/\//i.test(decoded) ? decoded : "";
    }catch(error){
        return "";
    }
}


const VIDEO_URL = getMediaUrl();


/* =========================================================
   ELEMENTOS
========================================================= */

const player =
    document.getElementById("player");

const video =
    document.getElementById("video");

const banner =
    document.getElementById("banner");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const errorText =
    document.getElementById("errorText");

const playBtn =
    document.getElementById("playBtn");

const centerPlayBtn =
    document.getElementById("centerPlayBtn");

const backBtn =
    document.getElementById("backBtn");

const forwardBtn =
    document.getElementById("forwardBtn");

const muteBtn =
    document.getElementById("muteBtn");

const volumeRange =
    document.getElementById("volumeRange");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const progressContainer =
    document.getElementById("progressContainer");

const progress =
    document.getElementById("progress");

const progressThumb =
    document.getElementById("progressThumb");

const time =
    document.getElementById("time");

const settings =
    document.getElementById("settings");

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsBottomBtn =
    document.getElementById("settingsBottomBtn");


/* =========================================================
   ESTADO
========================================================= */

let hls = null;

let fullscreenBusy = false;

let playBusy = false;

let hideControlsTimer = null;

let bufferingTimer = null;

let lastPlaybackTick = Date.now();

let hasStartedPlaying = false;


/* =========================================================
   BANNER
========================================================= */

function showBanner(){

    banner.classList.remove("hidden");

}


function hideBanner(){

    banner.classList.add("hidden");

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(show){

    if(show){

        loading.classList.add("show");

    }else{

        loading.classList.remove("show");

    }

}


function cancelBuffering(){

    clearTimeout(bufferingTimer);

    bufferingTimer = null;

    setLoading(false);

}


function scheduleBuffering(){

    clearTimeout(bufferingTimer);

    /*
       Não mostra imediatamente.
       O HLS pode emitir "waiting" mesmo
       enquanto ainda está entregando frames.
    */

    bufferingTimer = setTimeout(function(){

        if(
            !video.paused &&
            !video.ended &&
            Date.now() - lastPlaybackTick > 1200
        ){

            setLoading(true);

        }

    }, 1200);

}


/* =========================================================
   ERRO
========================================================= */

function showError(message){

    errorText.textContent =
        message ||
        "Verifique a transmissão e tente novamente.";

    errorBox.classList.add("show");

}


function hideError(){

    errorBox.classList.remove("show");

}


/* =========================================================
   PLAY UI
========================================================= */

function updatePlayUI(){

    const playing =
        !video.paused &&
        !video.ended;

    if(playing){

        playBtn.classList.add("is-playing");

        centerPlayBtn.classList.add("is-playing");

    }else{

        playBtn.classList.remove("is-playing");

        centerPlayBtn.classList.remove("is-playing");

    }

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

async function togglePlay(){

    if(playBusy){
        return;
    }

    playBusy = true;

    try{

        if(video.paused){

            hideError();

            /*
               Quando o usuário manda reproduzir,
               o banner desaparece.
            */

            hideBanner();

            const promise =
                video.play();

            if(promise){
                await promise;
            }

        }else{

            video.pause();

        }

    }catch(error){

        /*
           Se o navegador bloquear autoplay,
           o banner continua aparecendo.
        */

        showBanner();

        console.log(
            "Play bloqueado:",
            error
        );

    }finally{

        playBusy = false;

        updatePlayUI();

    }

}


/* =========================================================
   PLAY
========================================================= */

playBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        togglePlay();

    }
);


centerPlayBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        togglePlay();

    }
);


/* =========================================================
   BANNER CLICÁVEL
========================================================= */

banner.addEventListener(
    "click",
    function(){

        togglePlay();

    }
);


/* =========================================================
   VIDEO EVENTOS
========================================================= */

video.addEventListener(
    "play",
    function(){

        hideBanner();

        updatePlayUI();

    }
);


video.addEventListener(
    "playing",
    function(){

        hasStartedPlaying = true;

        lastPlaybackTick =
            Date.now();

        cancelBuffering();

        hideBanner();

        hideError();

        updatePlayUI();

    }
);


video.addEventListener(
    "pause",
    function(){

        cancelBuffering();

        /*
           Banner aparece automaticamente
           sempre que o vídeo estiver pausado.
        */

        showBanner();

        updatePlayUI();

    }
);


video.addEventListener(
    "ended",
    function(){

        showBanner();

        cancelBuffering();

        updatePlayUI();

    }
);


/* =========================================================
   TIMEUPDATE
========================================================= */

video.addEventListener(
    "timeupdate",
    function(){

        lastPlaybackTick =
            Date.now();

        /*
           Se o vídeo está avançando,
           definitivamente não está carregando.
        */

        if(!video.paused){

            cancelBuffering();

            hideBanner();

        }

        updateProgress();

    }
);


/* =========================================================
   BUFFERING
========================================================= */

video.addEventListener(
    "waiting",
    function(){

        /*
           NÃO colocar setLoading(true) diretamente aqui.

           O HLS dispara waiting em várias situações
           normais.
        */

        if(
            !video.paused &&
            !video.ended
        ){

            scheduleBuffering();

        }

    }
);


video.addEventListener(
    "stalled",
    function(){

        if(
            !video.paused &&
            !video.ended
        ){

            scheduleBuffering();

        }

    }
);


video.addEventListener(
    "canplay",
    function(){

        lastPlaybackTick =
            Date.now();

        cancelBuffering();

    }
);


video.addEventListener(
    "loadeddata",
    function(){

        lastPlaybackTick =
            Date.now();

        if(!video.paused){

            hideBanner();

        }

    }
);


/* =========================================================
   PROGRESSO
========================================================= */

function updateProgress(){

    const duration =
        video.duration;

    const current =
        video.currentTime;

    if(
        !Number.isFinite(duration) ||
        duration <= 0
    ){

        progress.style.width = "0%";

        progressThumb.style.left = "0%";

        time.textContent =
            formatTime(current) + " / LIVE";

        return;

    }

    const percent =
        Math.min(
            100,
            Math.max(
                0,
                (current / duration) * 100
            )
        );

    progress.style.width =
        percent + "%";

    progressThumb.style.left =
        percent + "%";

    time.textContent =
        formatTime(current)
        +
        " / "
        +
        formatTime(duration);

}


function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "00:00";

    }

    seconds =
        Math.floor(seconds);

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    if(hours > 0){

        return (
            String(hours).padStart(2,"0")
            +
            ":"
            +
            String(minutes).padStart(2,"0")
            +
            ":"
            +
            String(secs).padStart(2,"0")
        );

    }

    return (
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(secs).padStart(2,"0")
    );

}


/* =========================================================
   SEEK
========================================================= */

function seekBy(seconds){

    if(!Number.isFinite(video.currentTime)){
        return;
    }

    let target =
        video.currentTime + seconds;

    if(
        Number.isFinite(video.duration)
    ){

        target =
            Math.min(
                video.duration,
                Math.max(0,target)
            );

    }else{

        target =
            Math.max(0,target);

    }

    try{

        video.currentTime =
            target;

    }catch(error){

        console.log(
            "Erro no seek:",
            error
        );

    }

}


backBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        seekBy(-10);

    }
);


forwardBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        seekBy(10);

    }
);


/* =========================================================
   BARRA DE PROGRESSO
========================================================= */

function seekFromMouse(event){

    const rect =
        progressContainer.getBoundingClientRect();

    const percent =
        Math.min(
            1,
            Math.max(
                0,
                (event.clientX - rect.left)
                /
                rect.width
            )
        );

    if(
        Number.isFinite(video.duration) &&
        video.duration > 0
    ){

        video.currentTime =
            percent * video.duration;

    }

}


progressContainer.addEventListener(
    "click",
    seekFromMouse
);


/* =========================================================
   VOLUME
========================================================= */

volumeRange.addEventListener(
    "input",
    function(){

        video.volume =
            Number(this.value);

        video.muted =
            video.volume === 0;

        updateVolumeIcon();

    }
);


muteBtn.addEventListener(
    "click",
    function(){

        video.muted =
            !video.muted;

        if(video.muted){

            volumeRange.value = 0;

        }else{

            if(
                Number(volumeRange.value) === 0
            ){

                volumeRange.value = .8;

            }

            video.volume =
                Number(volumeRange.value);

        }

        updateVolumeIcon();

    }
);


function updateVolumeIcon(){

    if(
        video.muted ||
        video.volume === 0
    ){

        muteBtn.textContent = "🔇";

    }else if(
        video.volume < .5
    ){

        muteBtn.textContent = "🔉";

    }else{

        muteBtn.textContent = "🔊";

    }

}


/* =========================================================
   SETTINGS
========================================================= */

function toggleSettings(){

    settings.classList.toggle("show");

}


settingsBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        toggleSettings();

    }
);


settingsBottomBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        toggleSettings();

    }
);


document
.querySelectorAll(".speed-option")
.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            const speed =
                Number(
                    this.dataset.speed
                );

            video.playbackRate =
                speed;

            document
            .querySelectorAll(".speed-option")
            .forEach(function(item){

                item.classList.remove(
                    "active"
                );

            });

            this.classList.add("active");

            settings.classList.remove(
                "show"
            );

        }
    );

});


document.addEventListener(
    "click",
    function(){

        settings.classList.remove(
            "show"
        );

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

function getFullscreenElement(){

    return (
        document.fullscreenElement
        ||
        document.webkitFullscreenElement
        ||
        null
    );

}


async function enterFullscreen(){

    if(fullscreenBusy){
        return;
    }

    fullscreenBusy = true;

    try{

        if(
            player.requestFullscreen
        ){

            await player.requestFullscreen();

        }else if(
            player.webkitRequestFullscreen
        ){

            player.webkitRequestFullscreen();

        }else if(
            video.webkitEnterFullscreen
        ){

            video.webkitEnterFullscreen();

        }

    }catch(error){

        console.log(
            "Fullscreen:",
            error
        );

    }finally{

        setTimeout(
            function(){

                fullscreenBusy =
                    false;

            },
            400
        );

    }

}


async function exitFullscreen(){

    if(fullscreenBusy){
        return;
    }

    fullscreenBusy = true;

    try{

        if(
            document.exitFullscreen
            &&
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }else if(
            document.webkitExitFullscreen
            &&
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

    }catch(error){

        console.log(
            "Exit fullscreen:",
            error
        );

    }finally{

        setTimeout(
            function(){

                fullscreenBusy =
                    false;

            },
            400
        );

    }

}


async function toggleFullscreen(){

    if(getFullscreenElement()){

        await exitFullscreen();

    }else{

        await enterFullscreen();

    }

}


fullscreenBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        toggleFullscreen();

    }
);


function updateFullscreenIcon(){

    if(getFullscreenElement()){

        fullscreenBtn.textContent = "⛶";

    }else{

        fullscreenBtn.textContent = "⛶";

    }

}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenIcon
);

document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenIcon
);


/* =========================================================
   DUPLO CLIQUE
========================================================= */

player.addEventListener(
    "dblclick",
    function(e){

        if(
            e.target.closest("button") ||
            e.target.closest("input")
        ){

            return;

        }

        toggleFullscreen();

    }
);


/* =========================================================
   AUTO HIDE DOS CONTROLES
========================================================= */

function showControls(){

    player.classList.remove(
        "controls-hidden"
    );

    clearTimeout(
        hideControlsTimer
    );

    if(
        !video.paused &&
        !settings.classList.contains("show")
    ){

        hideControlsTimer =
            setTimeout(
                function(){

                    player.classList.add(
                        "controls-hidden"
                    );

                },
                3000
            );

    }

}


player.addEventListener(
    "mousemove",
    showControls
);

player.addEventListener(
    "touchstart",
    showControls,
    {passive:true}
);

player.addEventListener(
    "click",
    function(e){

        if(
            e.target.closest("button") ||
            e.target.closest("input") ||
            e.target.closest(".progress-container")
        ){

            showControls();

        }

    }
);


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.target.tagName === "INPUT"
        ){

            return;

        }

        switch(e.key){

            case " ":
            case "k":

                e.preventDefault();

                togglePlay();

                break;

            case "ArrowLeft":

                e.preventDefault();

                seekBy(-10);

                break;

            case "ArrowRight":

                e.preventDefault();

                seekBy(10);

                break;

            case "ArrowUp":

                e.preventDefault();

                video.volume =
                    Math.min(
                        1,
                        video.volume + .1
                    );

                volumeRange.value =
                    video.volume;

                video.muted = false;

                updateVolumeIcon();

                break;

            case "ArrowDown":

                e.preventDefault();

                video.volume =
                    Math.max(
                        0,
                        video.volume - .1
                    );

                volumeRange.value =
                    video.volume;

                updateVolumeIcon();

                break;

            case "f":

                e.preventDefault();

                toggleFullscreen();

                break;

        }

    }
);


/* =========================================================
   HLS
========================================================= */

function loadVideo(){

    setLoading(true);

    hideError();

    showBanner();

    const url =
        VIDEO_URL.trim();

    if(!url){

        setLoading(false);

        showError(
            "Informe a URL da mídia após /player/ na URL do site."
        );

        return;

    }

    const looksLikeHLS =
        /\.m3u8(?:$|[?#])/i.test(url);

    /*
       Safari / iPhone / alguns WebViews
       possuem HLS nativo.
    */

    const nativeHls =
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        );

    if(
        looksLikeHLS &&
        nativeHls
    ){

        video.src = url;

        video.load();

        return;

    }

    /*
       HLS.js
    */

    if(
        looksLikeHLS &&
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ){

        hls =
            new Hls({
                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:20,

                maxMaxBufferLength:30,

                liveSyncDurationCount:3,

                liveMaxLatencyDurationCount:6
            });

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                setLoading(false);

                /*
                   Não iniciamos autoplay
                   automaticamente para evitar
                   bloqueio do navegador.

                   O banner ficará visível.
                */

                updatePlayUI();

            }
        );

        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                console.log(
                    "HLS:",
                    data
                );

                if(
                    !data.fatal
                ){

                    return;

                }

                switch(data.type){

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        console.log(
                            "Tentando recuperar conexão..."
                        );

                        setLoading(true);

                        hls.startLoad();

                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:

                        console.log(
                            "Tentando recuperar mídia..."
                        );

                        hls.recoverMediaError();

                        break;

                    default:

                        setLoading(false);

                        showError(
                            "Erro fatal na transmissão."
                        );

                        break;

                }

            }
        );

        return;

    }

    /*
       Vídeo normal MP4/WebM/etc.
    */

    video.src = url;

    video.load();

}


/* =========================================================
   ERRO DO VIDEO
========================================================= */

video.addEventListener(
    "error",
    function(){

        /*
           Não mostra erro se o vídeo
           já está efetivamente rodando.
        */

        if(
            !hasStartedPlaying ||
            video.paused
        ){

            setLoading(false);

            showError(
                "Não foi possível carregar a transmissão."
            );

        }

    }
);


/* =========================================================
   VERIFICADOR DE REPRODUÇÃO
========================================================= */

setInterval(
    function(){

        if(
            !video.paused &&
            !video.ended
        ){

            /*
               Se o currentTime está avançando,
               o vídeo está funcionando.
            */

            if(
                Date.now() - lastPlaybackTick < 1200
            ){

                setLoading(false);

                hideBanner();

            }

        }

    },
    500
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

video.volume = 1;

video.muted = false;

volumeRange.value = 1;

updateVolumeIcon();

updatePlayUI();

loadVideo();

showControls();


/* =========================================================
   LIMPEZA
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        clearTimeout(
            hideControlsTimer
        );

        clearTimeout(
            bufferingTimer
        );

        if(hls){

            try{

                hls.destroy();

            }catch(error){

                console.log(error);

            }

        }

    }
);
</script>
